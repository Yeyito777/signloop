name: Signloop
options:
  bundleIdPrefix: com.yeyito
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.yeyito.signloop
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_LDFLAGS:
      - $(inherited)
      - -ObjC
      - -lc++
    "OTHER_LDFLAGS[sdk=iphoneos*]": $(inherited) -force_load "$(PROJECT_DIR)/Vendor/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a"
    "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(inherited) -force_load "$(PROJECT_DIR)/Vendor/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a"
targets:
  Signloop:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - Signloop
    info:
      path: Signloop/Info.plist
      properties:
        CFBundleDisplayName: Signloop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Signloop uses your camera to visualize hand joints on-device. No video is uploaded or saved.
        NSLocalNetworkUsageDescription: Connect to your Mac backend for automatic live sign estimates from hand coordinates. No camera images are sent.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        UIApplicationSupportsIndirectInputEvents: true
    dependencies:
      - framework: Vendor/MediaPipeTasksCommon/frameworks/MediaPipeTasksCommon.xcframework
        embed: false
      - framework: Vendor/MediaPipeTasksVision/frameworks/MediaPipeTasksVision.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: AssetsLibrary.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
schemes:
  Signloop:
    build:
      targets:
        Signloop: all
