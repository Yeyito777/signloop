name: HonkAndTell
configs:
  Debug: debug
  Release: release
  Demo: release
options:
  bundleIdPrefix: com.yeyito
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.yeyito.signloop
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "17"
    EXPRESSION_TRAINING_ENABLED: "YES"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_LDFLAGS:
      - $(inherited)
      - -ObjC
      - -lc++
    "OTHER_LDFLAGS[sdk=iphoneos*]": $(inherited) -force_load "$(PROJECT_DIR)/Vendor/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a"
    "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(inherited) -force_load "$(PROJECT_DIR)/Vendor/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a"
  configs:
    Demo:
      EXPRESSION_TRAINING_ENABLED: "NO"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SIGNLOOP_DEMO
targets:
  HonkAndTell:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_INCLUDE_PATHS: $(inherited) $(PROJECT_DIR)/Interop
        HEADER_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Vendor/TensorFlowLiteHeaders
    sources:
      - path: Signloop
        excludes:
          - RemoteRecognition.swift
          - Resources/DemoExpressionProfile.json
      - path: Vendor/TensorFlowLiteSwift
    preBuildScripts:
      - name: Validate bundled demo expression profile
        basedOnDependencyAnalysis: false
        script: |
          if [ "$EXPRESSION_TRAINING_ENABLED" = "NO" ]; then
            bash "$PROJECT_DIR/scripts/check-expression-profile.sh"
          fi
    postBuildScripts:
      - name: Embed fixed demo expression profile
        basedOnDependencyAnalysis: false
        script: |
          if [ "$EXPRESSION_TRAINING_ENABLED" = "NO" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp "$PROJECT_DIR/Signloop/Resources/DemoExpressionProfile.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DemoExpressionProfile.json"
          fi
    info:
      path: Signloop/Info.plist
      properties:
        CFBundleDisplayName: Honk & Tell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ExpressionTrainingEnabled: $(EXPRESSION_TRAINING_ENABLED)
        NSCameraUsageDescription: Honk & Tell tracks your hands, upper body and facial movements on your iPhone. No images or video are uploaded or saved.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        UIApplicationSupportsIndirectInputEvents: true
    dependencies:
      - framework: Vendor/MediaPipeTasksCommon/frameworks/MediaPipeTasksCommon.xcframework
        embed: false
      - framework: Vendor/MediaPipeTasksVision/frameworks/MediaPipeTasksVision.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: AssetsLibrary.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
  HonkAndTellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: HonkAndTell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HonkAndTell
        PRODUCT_BUNDLE_IDENTIFIER: com.yeyito.signloop.uitests
        OTHER_LDFLAGS: ""
        "OTHER_LDFLAGS[sdk=iphoneos*]": ""
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ""
schemes:
  HonkAndTell:
    build:
      targets:
        HonkAndTell: all
    test:
      targets:
        - HonkAndTellUITests
  HonkAndTellDemo:
    build:
      targets:
        HonkAndTell: all
    run:
      config: Demo
    archive:
      config: Demo
    test:
      config: Demo
      targets:
        - HonkAndTellUITests
